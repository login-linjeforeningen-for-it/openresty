worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /dev/stderr;
env TRAFFIC_SECRET;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    lua_package_path "/usr/local/share/lua/5.1/?.lua;;";
    lua_package_cpath "/usr/local/lib/lua/5.1/?.so;;";

    lua_shared_dict acme 16m;
    include resolver.conf;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 2;

    init_by_lua_block {
        require("resty.acme.autossl").init({
            tos_accepted = true,
            account_email = "tekkom@login.no",
            storage_adapter = "file",
            storage_config = { dir = "/etc/resty-acme" },
            domain_whitelist_callback = function(domain)
                return domain == "login.no" or domain:sub(-9) == ".login.no"
            end,
        })
    }

    init_worker_by_lua_block {
        require("resty.acme.autossl").init_worker()
    }

    set_real_ip_from 127.0.0.1;
    real_ip_header  proxy_protocol;

    server_names_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    log_format main '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '"$host" "$upstream_addr" "$upstream_status" "$upstream_response_time"';

    access_log /dev/stdout main buffer=32k flush=5s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 7;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    tcp_nodelay on;

    include /usr/local/openresty/nginx/conf.d/*.conf;
}

stream {
    log_format proxy '$remote_addr -> $ssl_preread_server_name -> $upstream_addr';
    access_log /dev/stdout proxy;

    map $ssl_preread_server_name $upstream {
        default                   10.30.0.40:443;
        login.no                  127.0.0.1:9443;
        ai.login.no               127.0.0.1:9443;
        app.login.no              127.0.0.1:9443;
        authentik.login.no        127.0.0.1:9443;
        beekeeper.login.no        127.0.0.1:9443;
        bot.login.no              127.0.0.1:9443;
        buskflytter.login.no      127.0.0.1:9443;
        daoud.login.no            127.0.0.1:9443;
        discord.login.no          127.0.0.1:9443;
        exam.login.no             127.0.0.1:9443;
        forms-api.login.no        127.0.0.1:9443;
        forms.login.no            127.0.0.1:9443;
        github.login.no           127.0.0.1:9443;
        git.login.no              127.0.0.1:9443;
        infra.login.no            127.0.0.1:9443;
        infrastruktur.login.no    127.0.0.1:9443;
        internal.login.no         127.0.0.1:9443;
        issues.login.no           127.0.0.1:9443;
        outline.login.no          127.0.0.1:9443;
        s3.login.no               127.0.0.1:9443;
        scrum.login.no            127.0.0.1:9443;
        spaces.login.no           127.0.0.1:9443;
        status.login.no           127.0.0.1:9443;
        studentbee-api.login.no   127.0.0.1:9443;
        studentbee.login.no       127.0.0.1:9443;
        wikijs.login.no           127.0.0.1:9443;
        wiki.login.no             127.0.0.1:9443;
        workerbee.login.no        127.0.0.1:9443;
    }

    server {
        listen 8443 proxy_protocol;
        ssl_preread on;
        proxy_pass $upstream;
        proxy_protocol on;
    }
}
